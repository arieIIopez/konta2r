name: one-time Public Life branch cleanup 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-life-branch-cleanup-2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete merged Public Life feature branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feature/public-life-benchmark"
            "feature/public-life-community-aggregates"
            "feature/public-life-corpus-manifest"
            "feature/public-life-evaluation"
            "feature/public-life-ground-truth"
            "feature/public-life-runtime"
            "feature/public-life-temporal-sampling"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done
