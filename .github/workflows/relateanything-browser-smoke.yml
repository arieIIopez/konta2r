name: relateanything-browser-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/relateanything-browser-smoke
    paths:
      - "tools/relateanything-browser-smoke/**"
      - "tools/run_relateanything_browser_smoke.mjs"
      - ".github/workflows/relateanything-browser-smoke.yml"

concurrency:
  group: relateanything-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install exact bank extraction dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.3.3"

      - name: Fetch exact vits16plus release
        run: node tools/fetch_relateanything_release.mjs maelic/relsgg-vits16plus .cache/relateanything/relsgg-vits16plus

      - name: Extract exact Public Life predicate subset
        run: python tools/extract_relateanything_bank.py --bank .cache/relateanything/relsgg-vits16plus/predicate_bank.npz --output .cache/relateanything/relsgg-vits16plus/public-life-bank.json --predicates "sitting on" "leaning against" "talking to" "riding" "holding"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false "playwright@1.55.0"
          npx playwright install chromium

      - name: Prepare browser-only runtime assets
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="tools/relateanything-browser-smoke"
          mkdir -p "$smoke_root/public/relateanything-smoke" "$smoke_root/public/ort"
          cp .cache/relateanything/relsgg-vits16plus/relateanything.onnx "$smoke_root/public/relateanything-smoke/relateanything.onnx"
          cp .cache/relateanything/relsgg-vits16plus/public-life-bank.json "$smoke_root/public/relateanything-smoke/public-life-bank.json"
          cp node_modules/onnxruntime-web/dist/*.wasm "$smoke_root/public/ort/"
          cp node_modules/onnxruntime-web/dist/*.mjs "$smoke_root/public/ort/"
          find "$smoke_root/public/ort" -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          ls -lh "$smoke_root/public/relateanything-smoke/"

      - name: Build static browser harness
        run: npx vite build tools/relateanything-browser-smoke

      - name: Start static browser harness
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m http.server 4174 --bind 127.0.0.1 --directory tools/relateanything-browser-smoke/dist >/tmp/relateanything-browser-static.log 2>&1 &
          echo "$!" >/tmp/relateanything-browser-static.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:4174/?backend=wasm" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:4174/?backend=wasm" >/dev/null
          curl --fail --silent "http://127.0.0.1:4174/ort/ort-wasm-simd-threaded.jsep.mjs" >/dev/null
          curl --fail --silent "http://127.0.0.1:4174/ort/ort-wasm-simd-threaded.jsep.wasm" >/dev/null
          curl --fail --silent "http://127.0.0.1:4174/relateanything-smoke/public-life-bank.json" >/dev/null
          test "$(curl --silent --range 0-0 "http://127.0.0.1:4174/relateanything-smoke/relateanything.onnx" | wc -c)" -ge 1

      - name: Execute Chromium WASM and WebGPU smoke
        id: browser_smoke
        continue-on-error: true
        run: node tools/run_relateanything_browser_smoke.mjs http://127.0.0.1:4174 docs/benchmarks/evidence/relateanything-vits16plus-browser-smoke.json

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relateanything-vits16plus-browser-smoke
          path: |
            docs/benchmarks/evidence/relateanything-vits16plus-browser-smoke.json
            /tmp/relateanything-browser-static.log
          if-no-files-found: warn

      - name: Commit reproducible browser evidence to feature branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          evidence="docs/benchmarks/evidence/relateanything-vits16plus-browser-smoke.json"
          if [ ! -f "$evidence" ]; then
            echo "No browser evidence file was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence"
          if git diff --cached --quiet; then
            echo "Browser evidence unchanged."
            exit 0
          fi
          git commit -m "evidence: record RelateAnything Chromium smoke"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop static browser harness
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/relateanything-browser-static.pid ]; then
            kill "$(cat /tmp/relateanything-browser-static.pid)" 2>/dev/null || true
          fi

      - name: Enforce Chromium WASM gate
        if: steps.browser_smoke.outcome == 'failure'
        run: |
          echo "Chromium WASM smoke failed; evidence was preserved when available."
          exit 1
