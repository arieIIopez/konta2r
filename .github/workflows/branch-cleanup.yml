name: one-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete superseded development branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
          "develop"
          "feature/annotated-detector-benchmark"
          "feature/annotation-composition"
          "feature/annotation-sampling"
          "feature/benchmark-annotation-ui"
          "feature/benchmark-diagnostics-ui"
          "feature/benchmark-input-files"
          "feature/benchmark-manifest-link"
          "feature/benchmark-reporting"
          "feature/benchmark-validity-gate"
          "feature/browser-video-benchmark-provider"
          "feature/community-bucket-runtime"
          "feature/community-delivery-runtime"
          "feature/community-delivery-v2"
          "feature/community-flow-runtime"
          "feature/community-http-handler"
          "feature/community-ingest-contract"
          "feature/community-ingestion-contract"
          "feature/community-protocol"
          "feature/confidence-sweep"
          "feature/corpus-manifest"
          "feature/corpus-manifest-builder"
          "feature/counting-geometry-runtime"
          "feature/counting-geometry-ui"
          "feature/detector-runtime"
          "feature/external-benchmark-session"
          "feature/external-detector-factory"
          "feature/field-pilot-evidence"
          "feature/modal-fusion"
          "feature/model-probe-selector"
          "feature/model-probe-ui"
          "feature/multiobject-tracker"
          "feature/nanodet-candidate"
          "feature/nanodet-pilot-runtime"
          "feature/nanodet-probe-codec"
          "feature/nanodet-probe-evidence"
          "feature/nanodet-wasm-smoke"
          "feature/node-community-ui"
          "feature/node-credential-contract"
          "feature/node-credential-vault"
          "feature/node-hmac-verification"
          "feature/node-inference-loop"
          "feature/node-lifecycle"
          "feature/node-local-binding"
          "feature/node-operational-status-panel"
          "feature/node-provisioning-client"
          "feature/onnx-detector-adapter"
          "feature/onnx-model-probe"
          "feature/opencv-probe-evidence"
          "feature/paired-detector-benchmark"
          "feature/paired-detector-comparison"
          "feature/pilot-capture-protocol"
          "feature/pilot-manifest-link"
          "feature/postgres-community-store"
          "feature/probe-diagnostic-import"
          "feature/probe-memory-and-record"
          "feature/probe-verification-gate"
          "feature/pwa-node"
          "feature/runtime-inference-bridge"
          "feature/runtime-smoke-probe-contract"
          "feature/ssd-tf-object-detection-codec"
          "feature/streaming-benchmark-runner"
          "feature/supabase-auth-foundation"
          "feature/supabase-deployment-readiness"
          "feature/supabase-edge-functions"
          "feature/trafficlab-spatial"
          "feature/vault-node-pepper"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          echo "Historical evidence branches intentionally retained:"
          echo "  evidence/probe-opencv-nanodet"
          echo "  evidence/probe-opencv-ssd"
          echo "  evidence/probe-opencv-ssd-v2"
