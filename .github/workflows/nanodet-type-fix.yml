name: nanodet-type-fix

on:
  push:
    branches:
      - feature/nanodet-probe-evidence
    paths:
      - .github/workflows/nanodet-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nanodet-probe-evidence
      - name: Apply strict indexed-access fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/detection/onnx/nanodetPlus.ts')
          text = source.read_text()
          old = """        const confidence = maxScores[location];
                  const classId = classIds[location];
                  if (!Number.isFinite(confidence) || confidence < this.scoreThreshold || classId < 0) continue;
          """.replace('                  ', '        ')
          new = """        const confidence = maxScores[location] ?? Number.NaN;
                  const classId = classIds[location] ?? -1;
                  if (!Number.isFinite(confidence) || confidence < this.scoreThreshold || classId < 0) continue;
          """.replace('                  ', '        ')
          if old not in text:
              raise SystemExit('source pattern not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/detection/onnx/nanodetPlus.test.ts')
          text = test.read_text()
          old = """    outputs['836'].data[(location * 80) + 1] = 0.9;
              for (let side = 0; side < 4; side += 1) {
                setDistributionPeak(outputs['839'].data, location, side, 1);
              }
          """.replace('              ', '    ')
          new = """    const classHead = outputs['836'];
              const bboxHead = outputs['839'];
              if (!classHead || !bboxHead) throw new Error('synthetic NanoDet heads missing');
              classHead.data[(location * 80) + 1] = 0.9;
              for (let side = 0; side < 4; side += 1) {
                setDistributionPeak(bboxHead.data, location, side, 1);
              }
          """.replace('              ', '    ')
          if old not in text:
              raise SystemExit('test pattern not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/detection/onnx/nanodetPlus.ts tests/detection/onnx/nanodetPlus.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: satisfy strict NanoDet indexed access"
          git push
