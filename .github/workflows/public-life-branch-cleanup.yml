name: one-time Public Life branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-life-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete merged Public Life branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feature/public-life-relations-foundation"
            "feature/public-life-relation-persistence"
            "feature/public-life-vocabulary"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done
