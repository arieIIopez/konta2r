name: nanodet-probe-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ONNX Runtime
        run: python -m pip install --disable-pip-version-check onnxruntime

      - name: Probe official NanoDet artifact
        run: |
          python tools/probe_nanodet.py \
            --url https://github.com/opencv/opencv_zoo/raw/main/models/object_detection_nanodet/object_detection_nanodet_2022nov.onnx \
            --expected-sha256 4b82da9944b88577175ee23a459dce2e26e6e4be573def65b1055dc2d9720186 \
            --expected-size 3800954 \
            --output docs/evidence/nanodet-m-plus-1.5x-416.onnx-probe.json

      - name: Upload observed contract
        uses: actions/upload-artifact@v4
        with:
          name: nanodet-onnx-probe
          path: docs/evidence/nanodet-m-plus-1.5x-416.onnx-probe.json
          if-no-files-found: error
