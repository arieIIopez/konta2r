name: nanodet-probe-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nanodet-probe-evidence
    paths:
      - tools/probe_nanodet.py
      - .github/workflows/nanodet-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ONNX Runtime
        run: python -m pip install --disable-pip-version-check onnxruntime

      - name: Probe official NanoDet artifact
        run: |
          python tools/probe_nanodet.py \
            --url https://github.com/opencv/opencv_zoo/raw/main/models/object_detection_nanodet/object_detection_nanodet_2022nov.onnx \
            --expected-sha256 4b82da9944b88577175ee23a459dce2e26e6e4be573def65b1055dc2d9720186 \
            --expected-size 3800954 \
            --output docs/evidence/nanodet-m-plus-1.5x-416.onnx-probe.json

      - name: Commit observed contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evidence/nanodet-m-plus-1.5x-416.onnx-probe.json
          if git diff --cached --quiet; then
            echo "Evidence unchanged"
            exit 0
          fi
          git commit -m "evidence: record NanoDet ONNX probe"
          git push
