name: nanodet-onnxruntime-web-wasm-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, konta2r]
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Execute exact checkpoint with ONNX Runtime Web WASM
        run: node tools/smoke_nanodet_ort_web.mjs

      - name: Upload runtime smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: nanodet-ort-web-wasm-smoke
          path: docs/benchmarks/evidence/nanodet-m-plus-1.5x-416-ort-web-wasm-smoke.json
          if-no-files-found: error
