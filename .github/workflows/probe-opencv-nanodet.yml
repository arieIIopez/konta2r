name: probe-opencv-nanodet

on:
  push:
    branches:
      - evidence/probe-opencv-nanodet
    paths:
      - tests/evidence/opencvNanodetProbe.evidence.test.ts
      - .github/workflows/probe-opencv-nanodet.yml
      - src/detection/modelCandidates.ts
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install

      - name: Execute evidence probe
        run: npx vitest run tests/evidence/opencvNanodetProbe.evidence.test.ts --reporter=verbose

      - name: Upload verified diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencv-nanodet-probe-diagnostic
          path: artifacts/opencv-nanodet-probe.json
          if-no-files-found: warn
          retention-days: 30
